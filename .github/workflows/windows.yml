name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test, publish and smoke-test Windows executables
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Verify service installation and removal on disposable runner
        shell: powershell
        run: ./scripts/Test-Install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rain-reminder-win-x64
          path: dist/rain-reminder-win-x64.zip
          if-no-files-found: error
